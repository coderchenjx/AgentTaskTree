name: Validate Agent Task Tree

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run task-tree scenarios
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\scenarios\Test-TaskTree.ps1

      - name: Check whitespace
        shell: pwsh
        run: git diff --check
